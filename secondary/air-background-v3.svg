<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 320" role="img" aria-label="Tactical regional airspace background">
  <title>Tactical regional airspace background</title>
  <desc>Compact airspace context with canted concentric procedural rings, sector boundaries, local fixes, range geometry, and sparse reference markings.</desc>
  <defs>
    <style><![CDATA[
      .strong{fill:none;stroke:#b9ced9;stroke-opacity:.86;stroke-width:2.1;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
      .mid{fill:none;stroke:#a9bfce;stroke-opacity:.68;stroke-width:1.7;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
      .ghost{fill:none;stroke:#91a8ba;stroke-opacity:.27;stroke-width:1.05;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
      .dash{fill:none;stroke:#a6bccb;stroke-opacity:.58;stroke-width:1.55;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
      .dashghost{fill:none;stroke:#96adbd;stroke-opacity:.31;stroke-width:1.05;stroke-dasharray:4.5 6.5;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision}
      .point{fill:#020402;stroke:#bdcfd9;stroke-opacity:.78;stroke-width:1.55;vector-effect:non-scaling-stroke}
      .label{fill:#c4d3dc;fill-opacity:.80;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.5px}
      .majorlabel{fill:#d2dee5;fill-opacity:.90;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.7px}
      .micro{fill:#aec1cd;fill-opacity:.48;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7px;font-weight:650;letter-spacing:.35px}
    ]]></style>
    <clipPath id="clip"><rect width="390" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- broad AO geometry, deliberately clipped by the scope -->
    <circle class="mid" cx="-48" cy="264" r="205"/>
    <circle class="ghost" cx="-48" cy="264" r="274"/>
    <path class="dashghost" d="M-48 264L330 16"/>
    <path class="ghost" d="M-48 264L401 186"/>

    <path class="strong" d="M31 73L101 39L181 57L229 37L323 70L359 139L339 222L270 274L176 263L93 229L39 177Z"/>
    <text class="majorlabel" x="73" y="89">SECTOR 4A</text>

    <!-- local internal boundaries -->
    <path class="ghost" d="M101 39L126 104L102 176L93 229"/>
    <path class="ghost" d="M181 57L188 124L230 165L339 222"/>

    <!-- restricted/special-use block -->
    <path class="dash" d="M244 68L306 59L355 93L349 142L302 156L258 127Z"/>
    <text class="majorlabel" x="286" y="84">R-2307</text>

    <!-- dominant local ring system, enlarged and canted -->
    <g transform="translate(198 168) rotate(-9) skewX(-5) scale(1.10 .88) translate(-198 -168)">
      <circle class="dash" cx="198" cy="168" r="39"/>
      <circle class="dash" cx="198" cy="168" r="70"/>
      <circle class="dash" cx="198" cy="168" r="101"/>
      <circle class="dashghost" cx="198" cy="168" r="132"/>

      <path class="mid" d="M198 132V204M162 168H234"/>
      <path class="dash" d="M88 89L306 247"/>
      <path class="dash" d="M100 239L302 100"/>

      <!-- odd local procedural core, intentionally under-explained -->
      <path class="mid" d="M184 150L193 145L201 150L211 148L218 157L216 168L221 178L211 186L201 184L192 190L183 182L185 172L179 163Z"/>
      <path class="ghost" d="M198 136v13M198 187v14M166 168h13M217 168h14"/>
    </g>

    <!-- original crossed-reference flavor survives as a stronger background construction -->
    <path class="dash" d="M104 95L284 251" opacity=".72"/>
    <path class="dash" d="M111 240L291 105" opacity=".72"/>

    <!-- local points and symbols -->
    <g transform="translate(112 111)">
      <circle class="point" r="7"/><circle class="ghost" r="2"/>
      <text class="label" x="11" y="3">CP21</text>
    </g>
    <g transform="translate(74 180)">
      <path class="mid" d="M-5 -5L5 5M5 -5L-5 5"/>
      <text class="micro" x="9" y="2">FX3</text>
    </g>
    <g transform="translate(291 213)">
      <circle class="point" r="7"/><circle class="ghost" r="2"/>
      <text class="label" x="11" y="3">CP24</text>
    </g>
    <g transform="translate(237 257)">
      <path class="mid" d="M-5 0H5M0-5V5"/>
      <text class="micro" x="9" y="2">K7</text>
    </g>

    <!-- compact holding feature -->
    <path class="dashghost" d="M296 191C310 181 334 182 345 193C356 204 352 219 338 224C322 230 305 226 296 217"/>
    <text class="micro" x="319" y="238">HLD24</text>

    <!-- tertiary local greebles -->
    <circle class="point" cx="143" cy="218" r="3.5" opacity=".58"/>
    <circle class="point" cx="250" cy="112" r="3.5" opacity=".58"/>
    <circle class="point" cx="325" cy="252" r="3.5" opacity=".45"/>
    <path class="ghost" d="M25 135h14M32 128v14M226 20h16M234 12v16M363 184h13M369 178v13"/>
    <path class="ghost" d="M-17 27L26 14L66 31L79 55M337 20L378 10L408 30M330 292L363 274L405 288"/>
    <path class="dashghost" d="M8 309L58 285L94 302L121 336"/>

    <text class="micro" x="15" y="42">BNDY 6</text>
    <text class="micro" x="350" y="37">AC-17</text>
    <text class="micro" x="221" y="32">120</text>
  </g>
</svg>