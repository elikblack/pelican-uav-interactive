<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican UAV Interactive — Panel</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    body{display:grid;place-items:center}
    .panel{
      position:relative;
      width:min(100vw,calc(100vh * 1371 / 1008));
      aspect-ratio:1371/1008;
      background:#282224 url("../shared/assets/panel_background.png") center/100% 100% no-repeat;
      overflow:hidden;
    }
    .screen{
      position:absolute;
      overflow:hidden;
      background:#000;
    }
    .screen iframe{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }
    .primary-screen{
      left:14.1503%;
      top:11.0119%;
      width:71.9183%;
      height:55.3571%;
    }
    .secondary-screen{
      left:13.9314%;
      top:75%;
      width:45.8789%;
      height:15.377%;
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Ground station panel composite">
    <div class="screen primary-screen">
      <iframe src="../primary/index.html" title="Primary mission display"></iframe>
    </div>
    <div class="screen secondary-screen">
      <iframe src="../secondary/index.html" title="Secondary systems display"></iframe>
    </div>
  </main>
</body>
</html>
